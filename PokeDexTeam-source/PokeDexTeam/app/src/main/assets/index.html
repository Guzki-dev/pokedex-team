function sprite(p){return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`}function render(){let a=$('#app');if(tab==='dex'){a.innerHTML=`<section class="panel"><h2>Pokédex completa</h2><input id="q" placeholder="Buscar por nome ou número..."/><div class="grid" style="margin-top:8px"><div><label>Tipo</label><select id="filtertype"><option value="all">Todos os tipos</option>${['normal','fire','water','electric','grass','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'].map(t=>`<option value="${t}">${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select></div><div><label>Região / geração</label><select id="filterregion"><option value="all">Todas as regiões</option>${['Kanto','Johto','Hoenn','Sinnoh','Unova','Kalos','Alola','Galar','Paldea'].map((r,i)=>`<option value="${i+1}">${r} · Gen ${i+1}</option>`).join('')}</select></div><div><label>Categoria</label><select id="filtercategory"><option value="all">Todos</option><option value="legendary">Lendários</option><option value="mythical">Míticos</option><option value="pseudo">Pseudo-lendários</option></select></div></div><div class="muted" id="dexcount" style="margin-top:8px">${allPokemon.length?allPokemon.length+' Pokémon carregados':'Conecte-se à internet para carregar todos os Pokémon.'}</div><div class="notice">Os filtros usam os dados disponíveis na PokéAPI. Para ROM hacks, a Pokédex padrão não representa necessariamente espécies exclusivas do hack.</div></section><div id="dexgrid" class="grid"></div>`;$('#q').oninput=drawDex;$('#filtertype').onchange=drawDex;$('#filterregion').onchange=drawDex;$('#filtercategory').onchange=drawDex;drawDex()}else if(tab==='teams'){a.innerHTML=`<section class="panel"><h2>Criar equipe</h2><label>Nome da equipe</label><input id="teamname" placeholder="Ex.: Time da aventura"/><label>Jogo / ROM hack</label><select id="game">${games.map(g=>`<option ${g===selectedGame?'selected':''}>${esc(g) ame?'selected':''}>${esc(g)}</option>`).join('')}</select><button class="primary" id="savegame">Salvar seleção</button></section><section class="panel"><h3>Suporte a ROM hacks</h3><p class="notice">O aplicativo permite cadastrar equipes para hacks. Para calcular atributos com precisão, será necessário definir os dados e as regras específicas de cada hack, pois alguns modificam stats-base, limites de EV ou mecânicas.</p></section>`;$('#savegame').onclick=()=>{selectedGame=$('#gamelist').value;localStorage.setItem('game',selectedGame);alert('Jogo selecionado: '+selectedGame);openTab('teams')}}}

function regionForGame(game){if(/Red \/ Blue|FireRed|LeafGreen/i.test(game))return 'kanto';if(/Gold \/ Silver|Crystal|HeartGold|SoulSilver/i.test(game))return 'johto';if(/Ruby|Sapphire|Emerald|Omega Ruby|Alpha Sapphire|Unbound|Radical Red|Gaia|Emerald Rogue/i.test(game))return 'hoenn';if(/Diamond|Pearl|Platinum/i.test(game))return 'sinnoh';if(/Black|White/i.test(game))return 'unova';if(/X \/ Y/i.test(game))return 'kalos';if(/Sun|Moon/i.test(game))return 'alola';if(/Sword|Shield/i.test(game))return 'galar';if(/Scarlet|Violet/i.test(game))return 'paldea';return 'kanto'}

async function drawDex(){let q=($('#q')?.value||'').toLowerCase().trim(),type=$('#filtertype')?.value||'all',region=$('#filterregion')?.value||'all',category=$('#filtercategory')?.value||'all';let g=$('#dexgrid');if(!g)return;let items=allPokemon.filter(p=>p.name.includes(q)||String(p.id)===q);if(region!=='all'){let [lo,hi]=regionRanges[Number(region)]||[1,1025];items=items.filter(p=>p.id>=lo&&p.id<=hi)}if(type!=='all'){let ids=await ensureTypeDex(type);if(ids)items=items.filter(p=>ids.includes(p.id));else {g.innerHTML='<div class="panel">Não consegui carregar o filtro de tipo. Verifique a conexão.</div>';return}}if(category!=='all'){if(category==='pseudo'){items=items.filter(p=>pseudoNames.has(p.name))}else{let metaList=items.filter(p=>!speciesMeta[p.name]);if(metaList.length){g.innerHTML='<div class="panel">Carregando classificação de lendários e míticos…<p class="notice">Na primeira consulta, pode levar um pouco para preparar os dados. Eles ficam em cache no aparelho.</p></div>';ensureSpeciesMeta(metaList);return}items=items.filter(p=>category==='legendary'?speciesMeta[p.name]?.legendary:speciesMeta[p.name]?.mythical)}}let count=$('#dexcount');if(count)count.textContent=`${items.length} resultado(s) · ${allPokemon.length} Pokémon no catálogo`;let shown=items.slice(0,90);g.innerHTML=shown.map(p=>`<div class="pokemon"><button class="pname" onclick="showPokemon('${esc(p.name)}')"><img loading="lazy" src="${sprite(p)}" alt="${esc(p.name)}"><span>${esc(p.name[0].toUpperCase()+p.name.slice(1))}</span></button><div class="muted" style="text-align:center">Nº ${String(p.id).padStart(4,'0')}</div><div style="margin-top:6px">${statusButtons(p.name)}</div><button class="secondary" style="width:100%;margin-top:8px" onclick="addToTeam('${esc(p.name)}')">+ Equipe</button></div>`).join('')||'<div class="panel">Nenhum resultado. Tente mudar os filtros ou verifique a conexão.</div>';if(items.length>shown.length)g.insertAdjacentHTML('beforeend',`<div class="panel" style="grid-colum async function showPokemon(name){detailReturn=tab;tab='detail';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));let a=$('#app');a.innerHTML=`<section class="panel"><button class="secondary" onclick="openTab('${detailReturn==='detail'?'dex':detailReturn}')">← Voltar</button><p class="muted">Carregando informações oficiais do catálogo de dados…</p></section>`;try{let r=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(name));if(!r.ok)throw 0;let p=await r.json();let species={};try{let sr=await fetch(p.species.url);species=await sr.json()}catch{}let moveRows=[];p.moves.forEach(m=>m.version_group_details.forEach(d=>moveRows.push({name:m.move.name,method:d.move_learn_method.name,level:d.level_learned_at,version:d.version_group.name,url:m.move.url})));let groups=[['Por nível','level-up'],['MT/MO / Máquina','machine'],['Tutor','tutor'],['Ovo','egg'],['Outros métodos','other']];let grouped={};moveRows.forEach(m=>{let k=m.method==='level-up'?'level-up':m.method==='machine'?'machine':m.method==='tutor'?'tutor':m.method==='egg'?'egg':'other';(grouped[k]??=[]).push(m)});let en=species.genera?.find(x=>x.language.name==='en')?.genus||'Pokémon';let types=p.types.map(t=>`<span class="pill">${esc(t.type.name)}</span>`).join('');a.innerHTML=`<section class="panel"><button class="secondary" onclick="openTab('${detailReturn==='detail'?'dex':detailReturn}')">← Voltar</button><div class="dexdetail"><img src="${sprite({id:p.id})}" alt="${esc(name)}"><div><h2>${esc(p.name.toUpperCase())} <span class="muted">#${String(p.id).padStart(4,'0')}</span></h2><div>${types}</div><p class="muted">Altura ${(p.height/10).toFixed(1)} m · Peso ${(p.weight/10).toFixed(1)} kg</p><p class="muted">Habilidades: ${p.abilities.map(x=>esc(x.ability.name)+(x.is_hidden?' (oculta)':'')).join(', ')}</p>${statusButtons(p.name)}</div></div><h3>Atributos-base</h3><div class="stats">${p.stats.map(x=>`<div class="stat"><label>${esc(x.stat.name.replace('-',' '))}</label><b function renderCaught(a){a.innerHTML=`<section class="panel"><h2>📘 Minha Pokédex por jogo</h2><p class="notice">Escolha um jogo. Pokémon ainda não capturados aparecem como silhuetas; marque como visto ou capturado para acompanhar sua jornada. O progresso fica salvo neste aparelho para cada jogo.</p><label>Jogo</label><select id="caughtgame">${games.map(g=>`<option ${g===selectedGame?'selected':''}>${esc(g)}</option>`).join('')}</select><div class="row" style="margin-top:10px"><div class="stat"><label>Capturados</label><b id="caughtcount">0</b></div><div class="stat"><label>Vistos</label><b id="seencount">0</b></div><div class="stat"><label>Faltando</label><b id="missingcount">0</b></div></div><input id="caughtq" placeholder="Buscar Pokémon..." style="margin-top:10px"><div class="statusline" style="margin-top:8px"><button class="secondary" id="showall">Todos</button><button class="secondary" id="showmissing">Faltando</button><button class="secondary" id="showseen">Vistos</button><button class="secondary" id="showcaptured">Capturados</button></div></section><div id="caughtgrid" class="grid"></div>`;let filter='all';$('#caughtgame').onchange=e=>{selectedGame=e.target.value;localStorage.setItem('game',selectedGame);drawCaught()};$('#caughtq').oninput=drawCaught;[['showall','all'],['showmissing','faltando'],['showseen','visto'],['showcaptured','capturado']].forEach(([id,v])=>$('#'+id).onclick=()=>{filter=v;drawCaught()});function drawCaught(){let q=$('#caughtq').value.toLowerCase(),counts={capturado:0,visto:0,faltando:0};allPokemon.forEach(p=>counts[getStatus(p.name)]++);$('#caughtcount').textContent=counts.capturado;$('#seencount').textContent=counts.visto;$('#missingcount').textContent=counts.faltando;let items=allPokemon.filter(p=>(p.name.includes(q)||String(p.id)===q)&&(filter==='all'||getStatus(p.name)===filter)).slice(0,150);$('#caughtgrid').innerHTML=items.map(p=>{let st=getStatus(p.name),dark=st!=='capturado';return `<div class="pokemon"><button class="pname" onc const statNames=['HP','Ataque','Defesa','Ataque Esp.','Defesa Esp.','Velocidade'];let baseStats=[35,55,40,50,50,90];function makeCalc(){let el=$('#calcstats');el.innerHTML='<div class="stats">'+statNames.map((s,i)=>`<div class="stat"><label>${s} · Base <span id="base${i}">${baseStats[i]}</span></label><div class="row"><div><label>IV (0–31)</label><input id="iv${i}" type="number" min="0" max="31" value="31"></div><div><label>EV (0–252)</label><input id="ev${i}" type="number" min="0" max="252" value="0"></div></div></div>`).join('')+'</div><p id="evsum" class="muted">EV total: 0 / 510</p>';$('#loadbase').onclick=loadBase;$('#calculate').onclick=calculate;el.querySelectorAll('input').forEach(i=>i.oninput=updateEv)}async function loadBase(){let name=$('#calcname').value.toLowerCase().trim();if(!name)return;try{let r=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(name));if(!r.ok)throw 0;let d=await r.json();let keys=['hp','attack','defense','special-attack','special-defense','speed'];baseStats=keys.map(k=>d.stats.find(s=>s.stat.name===k).base_stat);baseStats.forEach((v,i)=>$('#base'+i).textContent=v);$('#calcname').value=d.name;calculate()}catch(e){alert('Não consegui carregar esse Pokémon. Confira o nome e a conexão.')}}function updateEv(){let sum=0;for(let i=0;i<6;i++)sum+=Math.max(0,Math.min(252,Number($('#ev'+i).value)||0));$('#evsum').textContent=`EV total: ${sum} / 510`}
function calculate(){let lvl=Math.max(1,Math.min(100,Number($('#level').value)||50)),nature=$('#nature').value,up=null,down=null;const natureMap={Lonely:[1,2],Brave:[1,5],Adamant:[1,3],Naughty:[1,4],Bold:[2,1],Relaxed:[2,5],Impish:[2,3],Lax:[2,4],Timid:[5,1],Hasty:[5,2],Jolly:[5,3],Naive:[5,4],Modest:[3,1],Mild:[3,2],Quiet:[3,5],Rash:[3,4],Calm:[4,1],Gentle:[4,2],Sassy:[4,5],Careful:[4,3]};if(natureMap[nature]){up=natureMap[nature][0];down=natureMap[nature][1]}let out=[],sum=0;for(let i=0;i<6;i++){let iv=Math.max(0,Math.min(31,Number($('#iv'+i).value)||0)),ev=Math.max(0,Math.min(252,Number($('#ev'+i).value)||0)),b=baseStats[i];let val=i===0?Math.floor((2*b+iv+Math.floor(ev/4))*lvl/100)+lvl+10:Math.floor((Math.floor((2*b+iv+Math.floor(ev/4))*lvl/100)+5)*(i===up?1.1:i===down?0.9:1));out.push(val);sum+=Math.max(0,Math.min(252,Number($('#ev'+i).value)||0))}$('#calcresult').innerHTML=`<div class="result"><b>Atributos estimados · Nível ${lvl}</b><div class="stats" style="margin-top:8px">${out.map((v,i)=>`<div class="stat"><span class="muted">${statNames[i]}</span><div style="font-size:20px;font-weight:800">${v}</div></div>`).join('')}</div><p class="notice">EV total: ${sum}/510. Fórmula padrão de gerações III–IX; natureza neutra ou modificadora aplicada. Hacks que mudam regras precisam de configuração própria.</p></div>`;updateEv()}
