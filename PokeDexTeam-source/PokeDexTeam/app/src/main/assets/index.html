const $=s=>document.querySelector(s);let tab='dex',selectedTeamId=null,allPokemon=[],selectedGame=localStorage.getItem('game')||'Pokémon Emerald',areasCache=[],detailReturn='dex',teamEditor=null;const games=['Pokémon Red / Blue','Pokémon Gold / Silver / Crystal','Pokémon Ruby / Sapphire / Emerald','Pokémon FireRed / LeafGreen','Pokémon Diamond / Pearl / Platinum','Pokémon HeartGold / SoulSilver','Pokémon Black / White','Pokémon Black 2 / White 2','Pokémon X / Y','Pokémon Omega Ruby / Alpha Sapphire','Pokémon Sun / Moon','Pokémon Ultra Sun / Ultra Moon','Pokémon Sword / Shield','Pokémon Scarlet / Violet','Pokémon Unbound (ROM hack)','Pokémon Radical Red (ROM hack)','Pokémon Gaia (ROM hack)','Pokémon Emerald Rogue (ROM hack)','Pokémon GO (spin-off)','Pokémon Legends: Arceus (spin-off)','Pokémon Mystery Dungeon (spin-off)','Pokémon New Pokémon Snap (spin-off)','Pokémon Ranger (spin-off)','Pokémon Conquest (spin-off)','Pokémon Unite (spin-off)','Outro jogo / ROM hack'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function getTeams(){try{return JSON.parse(localStorage.getItem('teams')||'[]')}catch{return []}}function saveTeams(t){localStorage.setItem('teams',JSON.stringify(t))}const tabLabels={dex:'📘 Pokédex',teams:'👥 Minhas equipes',calc:'🧮 Calculadora IV / EV',games:'🕹️ Jogos e dados',maps:'🗺️ Mapas e rotas',caught:'🔴 Capturados',exclusives:'🎮 Exclusivos por versão',favorites:'⭐ Favoritos',compare:'⚖️ Comparar Pokémon',stats:'📊 Estatísticas',boxes:'📦 Caixas'};function closeHub(){document.querySelector('#sidehub')?.classList.remove('open');document.querySelector('#hub-overlay')?.classList.remove('open')}function openHub(){document.querySelector('#sidehub')?.classList.add('open');document.querySelector('#hub-overlay')?.classList.add('open')}function openTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));let label=document.querySelector('#hub-current');if(label)label.textContent=tabLabels[t]||'PokéDex Team';closeHub();render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));document.querySelector('#hub-open')?.addEventListener('click',openHub);document.querySelector('#hub-close')?.addEventListener('click',closeHub);document.querySelector('#hub-overlay')?.addEventListener('click',closeHub);
let speciesMeta={};try{speciesMeta=JSON.parse(localStorage.getItem('species-meta')||'{}')}catch{}let typeDexCache={};try{typeDexCache=JSON.parse(localStorage.getItem('type-dex-cache')||'{}')}catch{};let dexFilterBusy=false;
const typeNames={normal:'Normal',fire:'Fogo',water:'Água',electric:'Elétrico',grass:'Planta',ice:'Gelo',fighting:'Lutador',poison:'Veneno',ground:'Terra',flying:'Voador',psychic:'Psíquico',bug:'Inseto',rock:'Pedra',ghost:'Fantasma',dragon:'Dragão',dark:'Sombrio',steel:'Aço',fairy:'Fada'};
const typeEffect={normal:{weak:['fighting'],resist:[],immune:['ghost']},fire:{weak:['water','ground','rock'],resist:['fire','grass','ice','bug','steel','fairy']},water:{weak:['electric','grass'],resist:['fire','water','ice','steel']},electric:{weak:['ground'],resist:['electric','flying','steel']},grass:{weak:['fire','ice','poison','flying','bug'],resist:['water','electric','grass','ground']},ice:{weak:['fire','fighting','rock','steel'],resist:['ice']},fighting:{weak:['flying','psychic','fairy'],resist:['bug','rock','dark']},poison:{weak:['ground','psychic'],resist:['grass','fighting','poison','bug','fairy']},ground:{weak:['water','grass','ice'],resist:['poison','rock'],immune:['electric']},flying:{weak:['electric','ice','rock'],resist:['grass','fighting','bug'],immune:['ground']},psychic:{weak:['bug','ghost','dark'],resist:['fighting','psychic']},bug:{weak:['fire','flying','rock'],resist:['grass','fighting','ground']},rock:{weak:['water','grass','fighting','ground','steel'],resist:['normal','fire','poison','flying']},ghost:{weak:['ghost','dark'],resist:['poison','bug'],immune:['normal','fighting']},dragon:{weak:['ice','dragon','fairy'],resist:['fire','water','electric','grass']},dark:{weak:['fighting','bug','fairy'],resist:['ghost','dark'],immune:['psychic']},steel:{weak:['fire','fighting','ground'],resist:['normal','grass','ice','flying','psychic','bug','rock','dragon','steel','fairy'],immune:['poison']},fairy:{weak:['poison','steel'],resist:['fighting','bug','dark'],immune:['dragon']}};

function availableForGame(items,game){let gen=1;let match=game.match(/Pokémon (Red|Blue|Gold|Silver|Ruby|Sapphire|Diamond|Pearl|Black|White|X |Y |Sun |Moon |Sword|Shield|Scarlet|Violet)/i);if(/Gold|Silver|Crystal/.test(game))gen=2;else if(/Ruby|Sapphire|Emerald|FireRed|LeafGreen/.test(game))gen=3;else if(/Diamond|Pearl|Platinum|HeartGold|SoulSilver/.test(game))gen=4;else if(/Black|White/.test(game))gen=5;else if(/X \/ Y/.test(game))gen=6;else if(/Omega Ruby/.test(game))gen=6;else if(/Sun \/ Moon|Ultra Sun/.test(game))gen=7;else if(/Sword \/ Shield/.test(game))gen=8;else if(/Scarlet \/ Violet/.test(game))gen=9;let max={1:151,2:251,3:386,4:493,5:649,6:721,7:809,8:905,9:1025}[gen];return items.filter(p=>p.id<=max)}
async function drawTeamAnalysis(t){let el=$('#teamanalysis');if(!el)return;if(!t.members.length){el.innerHTML='<b>Equilíbrio de tipos</b><p class="muted">Adicione Pokémon para analisar as fraquezas e resistências.</p>';return}el.innerHTML='<b>Fraquezas e resistências</b><p class="muted">Consultando tipos dos integrantes…</p>';try{let typesByMember=[];for(let m of t.members){let n=memberName(m),p=allPokemon.find(x=>x.name===n);if(!p)continue;let r=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(n));if(!r.ok)continue;let d=await r.json();typesByMember.push({name:n,types:d.types.map(x=>x.type.name)})}let weak={},resist={},immune={};for(let member of typesByMember){let factors={};Object.keys(typeNames).forEach(atk=>{let mult=1;member.types.forEach(def=>{let e=typeEffect[def];if(e?.immune?.includes(atk))mult=0;else if(e?.weak?.includes(atk))mult*=2;else if(e?.resist?.includes(atk))mult*=.5});factors[atk]=mult});member.relevance=Object.entries(factors).filter(([ty,m])=>m>1).map(([ty,m])=>[ty,m]);member.coverage=Object.entries(factors).filter(([ty,m])=>m===0||m<1).map(([ty,m])=>[ty,m]);member.relevanceScore=member.relevance.length-member.coverage.length;member.relevance.forEach(([ty,m])=>weak[ty]=(weak[ty]||0)+1);member.coverage.forEach(([ty,m])=>{if(m===0)immune[ty]=(immune[ty]||0)+1;else resist[ty]=(resist[ty]||0)+1})}let chips=(obj)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([ty,n])=>`<span class="typechip">${typeNames[ty]} <b>${n} membro(s)</b></span>`).join('')||'<span class="muted">Nenhum tipo identificado</span>';let ranking=typesByMember.slice().sort((a,b)=>b.relevanceScore-a.relevanceScore).map(m=>`<div class="listitem"><b>${esc(m.name)}</b> <span class="muted">(${m.types.map(x=>typeNames[x]).join(' / ')})</span><div class="tiny">Cobertura defensiva: ${m.coverage.length} tipos resistidos/imunes · Vulnerabilidades: ${m.relevance.length} tipos</div></div>`).join('');el.innerHTML=`<h3>Fraquezas coletivas</h3><div>${chips(weak)}</div><h3>Resi function evolutionCondition(details){if(!details)return 'Condição especial';let parts=[];const itemPt={'fire-stone':'Pedra do Fogo','water-stone':'Pedra da Água','thunder-stone':'Pedra do Trovão','leaf-stone':'Pedra da Folha','moon-stone':'Pedra da Lua','sun-stone':'Pedra do Sol','ice-stone':'Pedra do Gelo','dusk-stone':'Pedra do Crepúsculo','dawn-stone':'Pedra do Amanhecer','shiny-stone':'Pedra Brilhante','oval-stone':'Pedra Oval','kings-rock':'Pedra do Rei','metal-coat':'Revestimento Metálico','dragon-scale':'Escama de Dragão','upgrade':'Upgrade','dubious-disc':'Disco Suspeito','protector':'Protetor','electirizer':'Eletrizador','magmarizer':'Magmarizador','razor-claw':'Garra Afiada','razor-fang':'Presa Afiada','prism-scale':'Escama Prisma','whipped-dream':'Doce Batido','sachet':'Sachê Perfumado','sweet-apple':'Maçã Doce','tart-apple':'Maçã Ácida','cracked-pot':'Bule Rachado','chipped-pot':'Bule Trincado','strawberry-sweet':'Doce de Morango','love-sweet':'Doce de Coração'};const itemName=n=>itemPt[n]||n.replace(/-/g,' ');if(details.min_level)parts.push('Atingir nível '+details.min_level);if(details.item?.name)parts.push('Usar '+itemName(details.item.name));if(details.held_item?.name)parts.push('Segurar '+itemName(details.held_item.name));if(details.min_happiness)parts.push('Amizade '+details.min_happiness);if(details.min_beauty)parts.push('Beleza '+details.min_beauty);if(details.min_affection)parts.push('Afeição '+details.min_affection);if(details.time_of_day)parts.push('Período: '+(details.time_of_day==='day'?'dia':details.time_of_day==='night'?'noite':details.time_of_day));if(details.location?.name)parts.push('Evoluir em: '+details.location.name.replace(/-/g,' '));if(details.trigger?.name)parts.push('Método: '+({'level-up':'Subir de nível','trade':'Troca','use-item':'Usar item','shed':'Evolução especial','spin':'Girar o personagem','tower-of-darkness':'Torre das Trevas','tower-of-waters':'Torre das Águas','three-critical-hits':'Acertar 3 golpes críticos','take-damage':'Receber dano','other':'Condição especial'}[details.trigger.name]||details.trigger.name.replace(/-/g,' '))); if(details.min_level===null&&details.trigger?.name==='level-up'&&!parts.some(x=>x.startsWith('Nível')))parts.push('Subir de nível');if(details.gender===1)parts.push('Fêmea');if(details.gender===2)parts.push('Macho');if(details.needs_overworld_rain)parts.push('Chuva no mundo');if(details.turn_upside_down)parts.push('Virar o aparelho de cabeça para baixo');if(details.relative_physical_stats!==null&&details.relative_physical_stats!==undefined)parts.push('Atributos físicos relativos: '+details.relative_physical_stats);if(details.party_species?.name)parts.push('Ter '+details.party_species.name+' na equipe');if(details.trade_species?.name)parts.push('Trocar por '+details.trade_species.name);if(details.known_move?.name)parts.push('Conhecer golpe '+details.known_move.name.replace(/-/g,' '));if(details.known_move_type?.name)parts.push('Conhecer golpe do tipo '+(typeNames[details.known_move_type.name]||details.known_move_type.name));if(details.party_type?.name)parts.push('Ter tipo '+(typeNames[details.party_type.name]||details.party_type.name)+' na equipe');if(details.turn_upside_down)parts.push('Girar dispositivo');return parts.join(' · ')||'Condição especial (detalhes não especificados na fonte)'}
async function loadEvolutionChain(species,currentId){let el=$('#evolution-content');if(!el||el.dataset.loaded==='1')return;el.innerHTML='<p class="muted">Consultando linha evolutiva…</p>';try{if(!species.evolution_chain?.url)throw 0;let r=await fetch(species.evolution_chain.url);if(!r.ok)throw 0;let data=await r.json(),nodes=[];function walk(node,prevCondition=''){let id=Number(node.species.url.match(/\/pokemon-species\/(\d+)\//)?.[1]||0);nodes.push({name:node.species.name,id,condition:prevCondition});(node.evolves_to||[]).forEach(next=>{let details=next.evolution_details?.[0];walk(next,evolutionCondition(details))})}walk(data.chain);let valid=nodes.filter(n=>n.id>0);let html='';for(let i=0;i<valid.length;i++){let n=valid[i];html+=`${i?`<div class="evo-arrow" aria-hidden="true">→<div class="evo-condition">${esc(n.condition)}</div></div>`:''}<div class="evo-card" role="button" tabindex="0" onclick="showPokemon('${esc(n.name)}')"><img loading="lazy" src="${sprite({id:n.id})}" alt="${esc(n.name)}"><b>${esc(n.name.replace(/-/g,' '))}</b><div class="tiny">#${String(n.id).padStart(4,'0')}</div><div class="tiny">Toque para abrir</div></div>`}el.innerHTML=html||'<p class="notice">Linha evolutiva indisponível.</p>';el.dataset.loaded='1'}catch{el.innerHTML='<p class="notice">Não foi possível carregar as evoluções. Tente novamente quando estiver online.</p>'}}
function renderCaught(a){a.innerHTML=`<section class="panel"><h2>📘 Minha Pokédex por jogo</h2><p class="notice">Toque uma vez no círculo para marcar como visto (branco). Toque duas vezes para marcar como capturado (Poké Bola). O progresso é salvo separadamente por jogo.</p><label>Jogo</label><select id="caughtgame">${games.map(g=>`<option ${g===selectedGame?'selected':''}>${esc(g)}</option>`).join('')}</select><div class="stat" style="margin-top:10px"><div class="row"><div><label>Progresso capturado</label><b id="percentlabel">0%</b></div><div style="text-align:right"><b id="caughtcount">0 / ${allPokemon.length}</b></div></div><div class="progressbar"><div id="progressfill" style="width:0%"></div></div><div class="muted">Percentual estimado do catálogo disponível para a geração do jogo selecionado. Jogos com Pokédex própria, remakes e spin-offs podem ter listas diferentes.</div></div><div class="row" style="margin-top:10px"><div class="stat"><label>Capturados</label><b id="caughtcountsmall">0</b></div><div class="stat"><label>Vistos</label><b id="seencount">0</b></div><div class="stat"><label>Faltando</label><b id="missingcount">0</b></div></div><label>Visualização</label><select id="caughtview"><option value="normal">Pokémon normais</option><option value="shiny">Shiny</option></select><input id="caughtq" placeholder="Buscar Pokémon..." style="margin-top:10px"><div class="statusline" style="margin-top:8px"><button class="secondary" id="showall">Todos</button><button class="secondary" id="showmissing">Faltando</button><button class="secondary" id="showseen">Vistos</button><button class="secondary" id="showcaptured">Capturados</button></div></section><div id="caughtgrid" class="grid"></div>`;let filter='all';$('#caughtgame').onchange=e=>{selectedGame=e.target.value;localStorage.setItem('game',selectedGame);drawCaught()};$('#caughtq').oninput=drawCaught;$('#caughtview').onchange=drawCaught;[['showall','all'],['showmissing','faltando'],['showseen','visto'],['showcaptured','capturado']].forEach(([id,v])=>$('#'+id).onclick=()=>{filter=v;drawCaught()});function drawCaught(){let q=$('#caughtq').value.toLowerCase(),catalog=allPokemon.filter(p=>isInGameCatalog(p,selectedGame)),counts={capturado:0,visto:0,faltando:0};catalog.forEach(p=>{let st=getStatus(p.name);counts[st]=(counts[st]||0)+1});let pct=catalog.length?Math.round(counts.capturado/catalog.length*1000)/10:0;$('#caughtcount').textContent=`${counts.capturado} / ${catalog.length}`;$('#caughtcountsmall').textContent=counts.capturado;$('#seencount').textContent=counts.visto;$('#missingcount').textContent=Math.max(0,catalog.length-counts.capturado-counts.visto);$('#percentlabel').textContent=pct+'%';$('#progressfill').style.width=pct+'%';let items=catalog.filter(p=>(p.name.includes(q)||String(p.id)===q)&&(filter==='all'||getStatus(p.name)===filter)).slice(0,150),shiny=$('#caughtview').value==='shiny';$('#caughtgrid').innerHTML=items.map(p=>{let st=getStatus(p.name),dark=st!=='capturado';return `<div class="pokemon"><button class="pname" onclick="showPokemon('${esc(p.name)}')"><img class="${dark?'silhouette':''}" loading="lazy" src="${sprite(p,shiny)}" alt="${dark?'Pokémon não capturado':esc(p.name)}"><span>${dark?'???':esc(p.name[0].toUpperCase()+p.name.slice(1))}</span></button><div class="muted" style="text-align:center">${dark?'Nº ????':'Nº '+String(p.id).padStart(4,'0')}</div>${statusCircle(p.name)}</div>`}).join('')||'<section class="panel">Nenhum Pokémon nessa lista.</section>'}drawCaught()}
function openTeam(id){selectedTeamId=id;tab='teamdetail';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='teams'));render()}
function renderTeamDetail(a){let t=getTeams().find(x=>x.id===selectedTeamId);if(!t){openTab('teams');return}a.innerHTML=`<section class="panel"><button class="secondary" onclick="openTab('teams')">← Voltar às equipes</button><h2 style="margin-top:12px">${esc(t.name)}</h2><p class="muted">${esc(t.game)} · ${t.members.length}/6 Pokémon</p><label>Adicionar Pokémon</label><input id="detailteamq" placeholder="Digite o nome do Pokémon…" autocomplete="off"><div id="detailteamsuggestions"></div><div id="teamanalysis" class="team-analysis">Calculando fraquezas e resistências…</div><div id="detailteamlist" class="grid" style="margin-top:12px"></div></section>`;$('#detailteamq').oninput=drawDetailSuggestions;drawDetailTeamMembers()}
function drawDetailSuggestions(){let q=$('#detailteamq').value.toLowerCase().trim(),el=$('#detailteamsuggestions');if(!q){el.innerHTML='';return}let ts=getTeams(),t=ts.find(x=>x.id===selectedTeamId);let m=availableForGame(allPokemon.filter(p=>p.name.includes(q)),t?.game||selectedGame).slice(0,8);el.innerHTML=m.map(p=>`<div class="suggestion"><span><img src="${sprite(p)}" alt="" width="38" height="38"> <span>${esc(p.name)} <small>#${p.id}</small></span></span><button class="secondary" onclick="addMemberToSelected('${esc(p.name)}')">Adicionar</button></div>`).join('')||'<div class="muted">Nenhum Pokémon encontrado.</div>'}
function addMemberToSelected(name){let ts=getTeams(),t=ts.find(x=>x.id===selectedTeamId);if(!t)return;if(t.members.length>=6)return alert('Cada equipe pode ter no máximo 6 Pokémon.');if(t.members.some(m=>memberName(m)===name))return alert('Esse Pokémon já está na equipe.');t.members.push({name,moves:[],ivs:Array(6).fill(31),evs:Array(6).fill(0)});saveTeams(ts);$('#detailteamq').value='';$('#detailteamsuggestions').innerHTML='';drawDetailTeamMembers()}
function drawDetailTeamMembers(){let t=getTeams().find(x=>x.id===selectedTeamId),el=$('#detailteamlist');if(!t||!el)return;drawTeamAnalysis(t);el.innerHTML=t.members.map(m=>{let n=memberName(m),obj=typeof m==='string'?{name:m,moves:[]}:m,p=allPokemon.find(x=>x.name===n);return `<div class="pokemon"><img loading="lazy" src="${p?sprite(p):''}" alt=""><b style="display:block;text-align:center">${esc(n)}</b><div class="tiny">Ataques: ${esc((obj.moves||[]).filter(Boolean).join(', ')||'não configurados')}</div><button class="secondary" style="width:100%;margin-top:6px" onclick="editTeamMember(${t.id},'${esc(n)}')">Ataques / IV / EV</button><button class="secondary" style="width:100%;margin-top:5px" onclick="removeTeamMember(${t.id},'${esc(n)}')">Remover</button></div>`}).join('')||'<div class="notice" style="grid-column:1/-1">Sua equipe está vazia. Pesquise um Pokémon acima para adicioná-lo.</div>';}
function drawSuggestions(){let q=$('#teamq').value.toLowerCase();let m=allPokemon.filter(p=>p.name.includes(q)).slice(0,8);$('#suggestions').innerHTML=m.map(p=>`<div class="listitem row"><span>${esc(p.name)} <small class="muted">#${p.id}</small></span><button class="secondary" onclick="addToTeam('${esc(p.name)}')">Adicionar</button></div>`).join('')}
function addToTeam(name){let ts=getTeams();if(!ts.length){ts.push({id:Date.now(),name:$('#teamname')?.value.trim()||'Minha equipe',game:selectedGame,members:[]})}let t=ts[ts.length-1];if(t.members.length>=6){alert('Cada equipe pode ter no máximo 6 Pokémon.');return}if(t.members.some(m=>memberName(m)===name)){alert('Esse Pokémon já está na equipe.');return}t.members.push({name,moves:[],ivs:Array(6).fill(31),evs:Array(6).fill(0)});saveTeams(ts);if(tab==='teams')drawTeams();else{openTab('teams')}}
function memberName(m){return typeof m==='string'?m:m.name}function drawTeams(){let el=$('#teamslist');if(!el)return;$('#teameditor')?.remove();let ts=getTeams();el.innerHTML=ts.map(t=>`<div class="listitem"><div class="row"><div><button class="team-open" onclick="openTeam(${t.id})">${esc(t.name)}　↗</button><div class="muted">${esc(t.game)} · ${t.members.length}/6 · Toque para editar a equipe</div></div><button class="secondary" onclick="deleteTeam(${t.id})">Excluir</button></div><div class="grid" style="margin-top:8px">${t.members.map(m=>{let n=memberName(m),obj=typeof m==='string'?{name:m,moves:[],ivs:Array(6).fill(31),evs:Array(6).fill(0)}:m;let p=allPokemon.find(x=>x.name===n);return `<div class="pokemon"><img loading="lazy" src="${p?sprite(p):`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${allPokemon.find(x=>x.name===n)?.id||1}.png`}" alt=""><b>${esc(n)}</b><div class="tiny">Ataques: ${esc((obj.moves||[]).filter(Boolean).join(', ')||'não configurados')}</div><button class="secondary" style="width:100%;margin-top:6px" onclick="editTeamMember(${t.id},'${esc(n)}')">Configurar</button><button class="secondary" style="width:100%;margin-top:5px" onclick="removeTeamMember(${t.id},'${esc(n)}')">Remover</button></div>`}).join('')}</div><div class="row" style="margin-top:8px"><input id="add-${t.id}" placeholder="Adicionar nome"><button class="secondary" onclick="addNamed(${t.id})">Adicionar</button></div></div>`).join('')||'<p class="muted">Ainda não há equipes salvas.</p>';if(teamEditor)renderTeamEditor()}
function deleteTeam(id){saveTeams(getTeams().filter(t=>t.id!==id));teamEditor=null;drawTeams()}function removeTeamMember(id,name){let ts=getTeams(),t=ts.find(t=>t.id===id);t.members=t.members.filter(m=>memberName(m)!==name);saveTeams(ts);teamEditor=null;if(tab==='teamdetail')drawDetailTeamMembers();else drawTeams()}function addNamed(id){let v=$('#add-'+id).value.trim().toLowerCase();if(!v)return;let ts=getTeams(),t=ts.find(t=>t.id===id);if(t.members.length>=6)return alert('Máximo de 6 Pokémon.');if(t.members.some(m=>memberName(m)===v))return alert('Esse Pokémon já está na equipe.');t.members.push({name:v,moves:[],ivs:Array(6).fill(31),evs:Array(6).fill(0)});saveTeams(ts);drawTeams()}
async function editTeamMember(id,name){teamEditor={id,name,moves:[],ivs:Array(6).fill(31),evs:Array(6).fill(0),available:[]};let ts=getTeams(),t=ts.find(t=>t.id===id),m=t.members.find(m=>memberName(m)===name);if(m&&typeof m==='object'){teamEditor.moves=m.moves||[];teamEditor.ivs=m.ivs||Array(6).fill(31);teamEditor.evs=m.evs||Array(6).fill(0)}try{let r=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(name));if(r.ok){let p=await r.json();teamEditor.available=p.moves.map(x=>x.move.name).sort()}}catch{}renderTeamEditor()}
function renderTeamEditor(){let old=$('#teameditor');if(old)old.remove();if(!teamEditor)return;let x=teamEditor,stats=['HP','Ataque','Defesa','Ataque Esp.','Defesa Esp.','Velocidade'];let div=document.createElement('section');div.id='teameditor';div.className='panel';div.innerHTML=`<h2>Configurar ${esc(x.name)}</h2><p class="notice">Escolha até quatro ataques e ajuste IV (0–31) e EV (0–252) por atributo. Esses dados são salvos localmente na equipe.</p><h3>Ataques</h3><div class="movegrid">${[0,1,2,3].map(i=>`<div><label>Ataque ${i+1}</label><select id="tm${i}"><option value="">— vazio —</option>${x.available.map(m=>`<option ${x.moves[i]===m?'selected':''} value="${esc(m)}">${esc(m.replace(/-/g,' '))}</option>`).join('')}</select></div>`).join('')}</div><h3>IVs</h3><div class="fieldgrid">${stats.map((n,i)=>`<div><label>${n}</label><input id="tiv${i}" type="number" min="0" max="31" value="${x.ivs[i]??31}"></div>`).join('')}</div><h3>EVs</h3><div class="fieldgrid">${stats.map((n,i)=>`<div><label>${n}</label><input id="tev${i}" type="number" min="0" max="252" value="${x.evs[i]??0}"></div>`).join('')}</div><p id="tevsum" class="muted"></p><button class="primary" id="saveteamconfig">Salvar configuração</button><button class="secondary" id="cancelteamconfig" style="width:100%;margin-top:8px">Cancelar</button>`;(tab==='teamdetail'?$('#detailteamlist'):$('#teamslist')).after(div);function sum(){let n=0;for(let i=0;i<6;i++)n+=Math.max(0,Math.min(252,Number($('#tev'+i).value)||0));$('#tevsum').textContent=`EV total: ${n}/510`};div.querySelectorAll('input').forEach(i=>i.oninput=sum);sum();$('#saveteamconfig').onclick=()=>{let ts=getTeams(),t=ts.find(t=>t.id===x.id),m=t.members.find(m=>memberName(m)===x.name);let obj=typeof m==='string'?{name:m}:m;obj.moves=[0,1,2,3].map(i=>$('#tm'+i).value);obj.ivs=[0,1,2,3,4,5].map(i=>Math.max(0,Math.min(31,Number($('#tiv'+i).value)||0)));obj.evs=[0,1,2,3,4,5].map(i=>Math.max(0,Math.min(252,Number($('#tev'+i).value)||0)));t.members=t.members.map(m=>memberName(m)===x.name?obj:m);saveTeams(ts);teamEditor=null;if(tab==='teamdetail')drawDetailTeamMembers();else drawTeams()};$('#cancelteamconfig').onclick=()=>{teamEditor=null;div.remove()}}
const statNames=['HP','Ataque','Defesa','Ataque Esp.','Defesa Esp.','Velocidade'];let baseStats=[35,55,40,50,50,90];function makeCalc(){let el=$('#calcstats');el.innerHTML='<div class="stats">'+statNames.map((s,i)=>`<div class="stat"><label>${s} · Base <span id="base${i}">${baseStats[i]}</span></label><div class="row"><div><label>IV (0–31)</label><input id="iv${i}" type="number" min="0" max="31" value="31"></div><div><label>EV (0–252)</label><input id="ev${i}" type="number" min="0" max="252" value="0"></div></div></div>`).join('')+'</div><p id="evsum" class="muted">EV total: 0 / 510</p>';$('#loadbase').onclick=loadBase;$('#calculate').onclick=calculate;el.querySelectorAll('input').forEach(i=>i.oninput=updateEv)}async function loadBase(){let name=$('#calcname').value.toLowerCase().trim();if(!name)return;try{let r=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(name));if(!r.ok)throw 0;let d=await r.json();let keys=['hp','attack','defense','special-attack','special-defense','speed'];baseStats=keys.map(k=>d.stats.find(s=>s.stat.name===k).base_stat);baseStats.forEach((v,i)=>$('#base'+i).textContent=v);$('#calcname').value=d.name;calculate()}catch(e){alert('Não consegui carregar esse Pokémon. Confira o nome e a conexão.')}}function updateEv(){let sum=0;for(let i=0;i<6;i++)sum+=Math.max(0,Math.min(252,Number($('#ev'+i).value)||0));$('#evsum').textContent=`EV total: ${sum} / 510`}
function calculate(){let lvl=Math.max(1,Math.min(100,Number($('#level').value)||50)),nature=$('#nature').value,up=null,down=null;const natureMap={Lonely:[1,2],Brave:[1,5],Adamant:[1,3],Naughty:[1,4],Bold:[2,1],Relaxed:[2,5],Impish:[2,3],Lax:[2,4],Timid:[5,1],Hasty:[5,2],Jolly:[5,3],Naive:[5,4],Modest:[3,1],Mild:[3,2],Quiet:[3,5],Rash:[3,4],Calm:[4,1],Gentle:[4,2],Sassy:[4,5],Careful:[4,3]};if(natureMap[nature]){up=natureMap[nature][0];down=natureMap[nature][1]}let out=[],sum=0;for(let i=0;i<6;i++){let iv=Math.max(0,Math.min(31,Number($('#iv'+i).value)||0)),ev=Math.max(0,Math.min(252,Number($('#ev'+i).value)||0)),b=baseStats[i];let val=i===0?Math.floor((2*b+iv+Math.floor(ev/4))*lvl/100)+lvl+10:Math.floor((Math.floor((2*b+iv+Math.floor(ev/4))*lvl/100)+5)*(i===up?1.1:i===down?0.9:1));out.push(val);sum+=Math.max(0,Math.min(252,Number($('#ev'+i).value)||0))}$('#calcresult').innerHTML=`<div class="result"><b>Atributos estimados · Nível ${lvl}</b><div class="stats" style="margin-top:8px">${out.map((v,i)=>`<div class="stat"><span class="muted">${statNames[i]}</span><div style="font-size:20px;font-weight:800">${v}</div></div>`).join('')}</div><p class="notice">EV total: ${sum}/510. Fórmula padrão de gerações III–IX; natureza neutra ou modificadora aplicada. Hacks que mudam regras precisam de configuração própria.</p></div>`;updateEv()}
