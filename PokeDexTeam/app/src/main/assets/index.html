<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071426"><title>PokéDex Team</title><style>
:root{--bg:#071426;--card:#10243c;--line:#244361;--txt:#f3f7ff;--muted:#a8bad0;--red:#ef4444;--blue:#1478ef;--green:#0c9b65}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui, sans-serif}header{padding:20px 16px 12px;background:#0d1d32;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0}h1 span{color:#ff5353}.sub{font-size:12px;color:var(--muted);margin-top:5px}.tabs{display:flex;gap:7px;margin-top:15px}.tabs button{flex:1;background:#203651;color:white;border:0;border-radius:10px;padding:11px 4px;font-weight:700}.tabs button.active{background:var(--red)}main{padding:14px;max-width:700px;margin:auto}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:14px 0 8px}label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}input,select{width:100%;background:#07182b;color:white;border:1px solid #34516f;border-radius:9px;padding:11px;font:inherit}button{cursor:pointer}.primary{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700;width:100%;margin-top:9px}.secondary{background:#203651;color:#fff;border:1px solid #34516f;border-radius:9px;padding:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pokemon{border:1px solid var(--line);border-radius:12px;padding:10px;background:#0a1b2f}.pokemon img{width:82px;height:82px;object-fit:contain;display:block;margin:auto}.muted{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;gap:9px}.row>*{flex:1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#091a2d;border-radius:9px;padding:8px}.stat label{margin:0 0 4px}.stat input{padding:8px}.result{background:#063e35;border-radius:10px;padding:10px;margin-top:10px}.listitem{padding:10px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;background:#263f5c;border-radius:20px;padding:4px 8px;font-size:11px;margin:3px 3px 0 0}.notice{font-size:12px;color:var(--muted);line-height:1.5}footer{color:#8197b0;text-align:center;font-size:11px;padding:20px}@media(min-width:540px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><header><h1>◉ PokéDex <span>Team</span></h1><div class="sub">Sua coleção. Suas equipes. Sua jornada.</div><nav class="tabs"><button class="active" data-tab="dex">Pokédex</button><button data-tab="teams">Equipes</button><button data-tab="calc">IV / EV</button><button data-tab="games">Jogos</button><button data-tab="maps">Mapas</button></nav></header><main id="app"></main><footer>PokéDex Team · Mapas, encontros, IV/EV e progresso por jogo · Dados online com cache local</footer><script>
const $=s=>document.querySelector(s);let tab='dex',allPokemon=[],selectedGame=localStorage.getItem('game')||'Pokémon Emerald',areasCache=[];const games=['Pokémon Red / Blue','Pokémon Gold / Silver / Crystal','Pokémon Ruby / Sapphire / Emerald','Pokémon FireRed / LeafGreen','Pokémon Diamond / Pearl / Platinum','Pokémon HeartGold / SoulSilver','Pokémon Black / White','Pokémon Black 2 / White 2','Pokémon X / Y','Pokémon Omega Ruby / Alpha Sapphire','Pokémon Sun / Moon','Pokémon Ultra Sun / Ultra Moon','Pokémon Sword / Shield','Pokémon Scarlet / Violet','Pokémon Unbound (ROM hack)','Pokémon Radical Red (ROM hack)','Pokémon Gaia (ROM hack)','Pokémon Emerald Rogue (ROM hack)','Outro jogo / ROM hack'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function getTeams(){try{return JSON.parse(localStorage.getItem('teams')||'[]')}catch{return []}}function saveTeams(t){localStorage.setItem('teams',JSON.stringify(t))}function openTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));
async function loadDex(){let cache=localStorage.getItem('dex-cache');if(cache){try{allPokemon=JSON.parse(cache)}catch{}}render();if(!navigator.onLine)return;try{let r=await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');if(!r.ok)return;let d=await r.json();allPokemon=d.results.map((p,i)=>({name:p.name,id:i+1,url:p.url}));localStorage.setItem('dex-cache',JSON.stringify(allPokemon));render()}catch(e){}}
function sprite(p){return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`}function render(){let a=$('#app');if(tab==='dex'){a.innerHTML=`<section class="panel"><h2>Pokédex</h2><input id="q" placeholder="Buscar por nome ou número..."/><div class="muted" style="margin-top:8px">${allPokemon.length?allPokemon.length+' Pokémon no índice carregado':'Conecte-se à internet para carregar a Pokédex. O que já foi consultado pode ficar em cache.'}</div></section><div id="dexgrid" class="grid"></div>`;$('#q').oninput=drawDex;drawDex()}else if(tab==='teams'){a.innerHTML=`<section class="panel"><h2>Criar equipe</h2><label>Nome da equipe</label><input id="teamname" placeholder="Ex.: Time da aventura"/><label>Jogo / ROM hack</label><select id="game">${games.map(g=>`<option ${g===selectedGame?'selected':''}>${esc(g)}</option>`).join('')}</select><label>Buscar Pokémon para adicionar</label><input id="teamq" placeholder="Nome do Pokémon"/><div id="suggestions"></div><h3>Equipes salvas</h3><div id="teamslist"></div><button class="primary" id="newteam">Criar equipe vazia</button></section>`;$('#game').onchange=e=>{selectedGame=e.target.value;localStorage.setItem('game',selectedGame)};$('#teamq').oninput=drawSuggestions;$('#newteam').onclick=()=>{let name=$('#teamname').value.trim()||'Minha equipe';let ts=getTeams();ts.push({id:Date.now(),name,game:selectedGame,members:[]});saveTeams(ts);render()};drawTeams();}else if(tab==='calc'){a.innerHTML=`<section class="panel"><h2>Calculadora de IV / EV</h2><div class="notice">Modelo de atributos para jogos das gerações III em diante. Selecione o Pokémon, nível, natureza e insira os valores de IV/EV. ROM hacks podem alterar fórmulas ou atributos-base; nesses casos, confirme os dados do hack.</div><label>Pokémon</label><input id="calcname" value="pikachu" placeholder="Ex.: pikachu"/><button class="secondary" id="loadbase">Carregar atributos-base online</button><div class="row"><div><label>Nível</label><input id="level" type="number" min="1" max="100" value="50"/></div><div><label>Natureza</label><select id="nature">${['Hardy','Lonely','Brave','Adamant','Naughty','Bold','Docile','Relaxed','Impish','Lax','Timid','Hasty','Serious','Jolly','Naive','Modest','Mild','Quiet','Bashful','Rash','Calm','Gentle','Sassy','Careful','Quirky'].map(n=>`<option>${n}</option>`).join('')}</select></div></div><div id="calcstats"></div><button class="primary" id="calculate">Calcular atributos</button><div id="calcresult"></div></section>`;makeCalc();}else if(tab==='maps'){renderMaps(a)}else{a.innerHTML=`<section class="panel"><h2>Jogos e ROM hacks</h2><p class="muted">Escolha o jogo que está usando para associá-lo às novas equipes.</p><label>Jogo selecionado</label><select id="gamelist">${games.map(g=>`<option ${g===selectedGame?'selected':''}>${esc(g)}</option>`).join('')}</select><button class="primary" id="savegame">Salvar seleção</button></section><section class="panel"><h3>Suporte a ROM hacks</h3><p class="notice">O aplicativo permite cadastrar equipes para hacks. Para calcular atributos com precisão, será necessário definir os dados e as regras específicas de cada hack, pois alguns modificam stats-base, limites de EV ou mecânicas.</p></section>`;$('#savegame').onclick=()=>{selectedGame=$('#gamelist').value;localStorage.setItem('game',selectedGame);alert('Jogo selecionado: '+selectedGame);openTab('teams')}}}
const versionsByGame={
'Pokémon Red / Blue':['red','blue','yellow'],'Pokémon Gold / Silver / Crystal':['gold','silver','crystal'],'Pokémon Ruby / Sapphire / Emerald':['ruby','sapphire','emerald'],'Pokémon FireRed / LeafGreen':['firered','leafgreen'],'Pokémon Diamond / Pearl / Platinum':['diamond','pearl','platinum'],'Pokémon HeartGold / SoulSilver':['heartgold','soulsilver'],'Pokémon Black / White':['black','white'],'Pokémon Black 2 / White 2':['black-2','white-2'],'Pokémon X / Y':['x','y'],'Pokémon Omega Ruby / Alpha Sapphire':['omega-ruby','alpha-sapphire'],'Pokémon Sun / Moon':['sun','moon'],'Pokémon Ultra Sun / Ultra Moon':['ultra-sun','ultra-moon'],'Pokémon Sword / Shield':['sword','shield'],'Pokémon Scarlet / Violet':['scarlet','violet']};
function statusKey(){return 'capture-status:'+selectedGame}function getStatus(name){try{return JSON.parse(localStorage.getItem(statusKey())||'{}')[name]||'faltando'}catch{return 'faltando'}}function setStatus(name,status){let x={};try{x=JSON.parse(localStorage.getItem(statusKey())||'{}')}catch{}x[name]=status;localStorage.setItem(statusKey(),JSON.stringify(x));if(tab==='dex')drawDex();else if(tab==='maps')renderMaps($('#app'))}function statusButtons(name){let st=getStatus(name);return `<select aria-label="Status de ${esc(name)}" onchange="setStatus('${esc(name)}',this.value)" style="padding:6px;font-size:12px"><option value="faltando" ${st==='faltando'?'selected':''}>○ Faltando</option><option value="visto" ${st==='visto'?'selected':''}>◉ Visto</option><option value="capturado" ${st==='capturado'?'selected':''}>✓ Capturado</option></select>`}
function slug(s){return s.toLowerCase().replace(/-/g,' ').replace(/\s+/g,'-')}
async function renderMaps(a){a.innerHTML=`<section class="panel"><h2>🗺️ Mapas e exploração</h2><p class="notice">Escolha um jogo para explorar áreas, consultar encontros e acompanhar sua coleção. Mapas esquemáticos e listas usam dados disponíveis; a cobertura varia conforme o jogo.</p><label>Jogo / ROM hack</label><select id="mapgame">${games.map(g=>`<option ${g===selectedGame?'selected':''}>${esc(g)}</option>`).join('')}</select><label>Buscar cidade, rota, caverna ou local</label><input id="areasearch" placeholder="Ex.: Route, forest, cave..."/><div class="row"><button class="secondary" id="mapview">Mapa esquemático</button><button class="secondary" id="listview">Lista de locais</button></div><div id="mapvisual" style="margin-top:12px"></div><div id="areaslist" style="margin-top:10px"></div></section><section class="panel"><h3>Seu progresso neste jogo</h3><div id="progress"></div></section>`;
$('#mapgame').onchange=e=>{selectedGame=e.target.value;localStorage.setItem('game',selectedGame);renderMaps($('#app'))};$('#mapview').onclick=()=>drawAreaList(true);$('#listview').onclick=()=>{ $('#areasearch').value=''; drawAreaList(false) };$('#areasearch').oninput=()=>drawAreaList(false);drawProgress();
const cached=localStorage.getItem('areas-cache:'+selectedGame);if(cached){try{areasCache=JSON.parse(cached)}catch{areasCache=[]}}drawAreaList(true);if(!navigator.onLine)return;
try{let version=versionsByGame[selectedGame];if(version){let r=await fetch('https://pokeapi.co/api/v2/location-area?limit=1000');if(r.ok){let d=await r.json();areasCache=d.results;localStorage.setItem('areas-cache:'+selectedGame,JSON.stringify(areasCache));drawAreaList(true)}}else{$('#areaslist').innerHTML='<p class="notice">Para este título, ainda não há um catálogo de locais validado integrado. Você pode consultar os locais armazenados, se disponíveis, ou cadastrar os locais do hack quando houver uma fonte confiável.</p>'}}catch(e){$('#areaslist').innerHTML='<p class="notice">Sem conexão. Mostrando dados de locais que já estejam em cache.</p>'}}
function drawProgress(){let obj={};try{obj=JSON.parse(localStorage.getItem(statusKey())||'{}')}catch{}let vals=Object.values(obj);let c=vals.filter(v=>v==='capturado').length,v=vals.filter(v=>v==='visto').length,f=vals.filter(v=>v==='faltando').length;$('#progress').innerHTML=`<div class="stats"><div class="stat"><b>${c}</b><div class="muted">Capturados</div></div><div class="stat"><b>${v}</b><div class="muted">Vistos</div></div><div class="stat"><b>${f}</b><div class="muted">Marcados faltando</div></div><div class="stat"><b>${vals.length}</b><div class="muted">Com status definido</div></div></div><p class="notice">O progresso é separado por jogo e fica salvo localmente no aparelho.</p>`}
const regionNodes={
  kanto:[['Pallet Town',30,105],['Viridian City',67,80],['Pewter City',91,48],['Cerulean City',155,40],['Vermilion City',158,104],['Lavender Town',205,69],['Celadon City',126,82],['Fuchsia City',108,130],['Saffron City',171,72],['Cinnabar Island',47,145]],
  johto:[['New Bark Town',34,128],['Cherrygrove City',62,106],['Violet City',82,76],['Azalea Town',83,115],['Goldenrod City',133,72],['Ecruteak City',159,48],['Olivine City',116,113],['Cianwood City',79,145],['Mahogany Town',202,59],['Blackthorn City',247,34]],
  hoenn:[['Littleroot Town',35,127],['Oldale Town',58,108],['Petalburg City',78,82],['Rustboro City',96,49],['Dewford Town',76,144],['Slateport City',126,116],['Mauville City',150,83],['Verdanturf Town',128,68],['Fallarbor Town',151,42],['Lavaridge Town',182,58],['Fortree City',220,45],['Lilycove City',250,83],['Mossdeep City',279,103],['Sootopolis City',235,129]],
  sinnoh:[['Twinleaf Town',36,128],['Sandgem Town',58,108],['Jubilife City',88,82],['Oreburgh City',109,55],['Floaroma Town',86,48],['Eterna City',121,32],['Hearthome City',143,76],['Solaceon Town',177,58],['Veilstone City',198,84],['Pastoria City',171,115],['Celestic Town',223,49],['Canalave City',62,75],['Sunyshore City',260,105],['Snowpoint City',244,24]],
  unova:[['Nuvema Town',36,130],['Accumula Town',60,111],['Striaton City',78,84],['Nacrene City',110,65],['Castelia City',140,104],['Nimbasa City',163,75],['Driftveil City',183,111],['Mistralton City',199,55],['Icirrus City',227,37],['Opelucid City',251,62],['Lacunosa Town',270,83]],
  kalos:[['Vaniville Town',32,129],['Aquacorde Town',54,108],['Santalune City',77,88],['Lumiose City',134,77],['Camphrier Town',91,115],['Cyllage City',162,112],['Ambrette Town',194,131],['Geosenge Town',193,86],['Shalour City',222,102],['Coumarine City',207,56],['Laverre City',240,43],['Anistar City',266,72],['Snowbelle City',270,30]],
  alola:[['Iki Town',38,42],['Hauoli City',72,76],['Heahea City',126,93],['Paniola Town',158,66],['Konikoni City',164,126],['Malie City',210,47],['Po Town',242,80],['Seafolk Village',275,126]],
  galar:[['Postwick',35,127],['Wedgehurst',61,106],['Motostoke',94,84],['Turffield',124,66],['Hulbury',139,112],['Hammerlocke',164,74],['Stow-on-Side',187,47],['Ballonlea',214,40],['Circhester',241,51],['Spikemuth',254,94],['Wyndon',279,70]],
  paldea:[['Cabo Poco',34,130],['Los Platos',62,111],['Mesagoza',100,86],['Cortondo',79,67],['Artazon',134,55],['Levincia',181,73],['Cascarrafa',121,112],['Porto Marinada',88,91],['Medali',164,43],['Montenevera',215,28],['Alfornada',184,126],['Zapapico',222,87],['Montenevera',242,48]]
};
function regionForGame(game){if(/Red \/ Blue|FireRed|LeafGreen/i.test(game))return 'kanto';if(/Gold \/ Silver|Crystal|HeartGold|SoulSilver/i.test(game))return 'johto';if(/Ruby|Sapphire|Emerald|Omega Ruby|Alpha Sapphire|Unbound|Radical Red|Gaia|Emerald Rogue/i.test(game))return 'hoenn';if(/Diamond|Pearl|Platinum/i.test(game))return 'sinnoh';if(/Black|White/i.test(game))return 'unova';if(/X \/ Y/i.test(game))return 'kalos';if(/Sun|Moon/i.test(game))return 'alola';if(/Sword|Shield/i.test(game))return 'galar';if(/Scarlet|Violet/i.test(game))return 'paldea';return 'kanto'}
function drawAreaList(mapMode){let el=$('#areaslist');if(!el)return;let q=($('#areasearch')?.value||'').toLowerCase();let arr=areasCache.filter(x=>x.name.replace(/-/g,' ').includes(q)).slice(0,100);let region=regionForGame(selectedGame);let nodes=regionNodes[region]||regionNodes.kanto;$('#mapvisual').innerHTML=mapMode?`<div style="background:linear-gradient(135deg,#123e4b,#1b674e);border:1px solid #3b806e;border-radius:12px;padding:12px"><div style="text-align:center;font-weight:800;margin-bottom:4px">MAPA ESQUEMÁTICO NAVEGÁVEL · ${esc(region.toUpperCase())}</div><p class="notice" style="text-align:center">Toque em uma cidade para buscar locais relacionados. Ilustração de navegação, não é um mapa geográfico oficial.</p><svg viewBox="0 0 310 165" width="100%" role="img" aria-label="Mapa esquemático interativo da região"><path d="M18 29 L69 12 L126 20 L169 8 L231 25 L294 48 L282 108 L248 145 L188 157 L129 140 L77 151 L29 109 Z" fill="#24734f" stroke="#73c49a" stroke-width="2"/><path d="${nodes.map((n,i)=>i?`M${nodes[i-1][1]} ${nodes[i-1][2]} L${n[1]} ${n[2]}`:'').join(' ')}" fill="none" stroke="#e5d18a" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/>${nodes.map((n,i)=>`<g class="map-node" data-place="${esc(n[0])}" style="cursor:pointer"><circle cx="${n[1]}" cy="${n[2]}" r="6" fill="#fff2b3" stroke="#153a4a" stroke-width="2"/><text x="${n[1]}" y="${n[2]-9}" fill="white" font-size="7" text-anchor="middle" stroke="#153a4a" stroke-width=".7" paint-order="stroke">${esc(n[0])}</text></g>`).join('')}</svg><p id="maphint" class="notice">Selecione uma cidade no desenho ou use a lista de locais abaixo.</p></div>`:'';if(mapMode){document.querySelectorAll('.map-node').forEach(n=>n.onclick=()=>{let place=n.dataset.place;$('#areasearch').value=place;$('#maphint').textContent='Local selecionado: '+place+'. A lista abaixo mostra resultados que correspondem ao nome, quando disponíveis no catálogo online.';drawAreaList(true)})}el.innerHTML=arr.map((x,i)=>`<div class="listitem"><div class="row"><div><b>${esc(x.name.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()))}</b><div class="muted">Área disponível no catálogo de dados</div></div><button class="secondary" onclick="loadArea('${esc(x.url)}','${esc(x.name)}')">Ver encontros</button></div></div>`).join('')||'<p class="notice">Nenhum local encontrado para essa busca. Tente outro termo ou toque em “Lista de locais” para limpar a visualização do mapa.</p>';drawProgress()}
async function loadArea(url,name){let el=$('#areaslist');el.innerHTML='<p class="muted">Carregando encontros...</p>';try{let r=await fetch(url);if(!r.ok)throw 0;let d=await r.json();let version=versionsByGame[selectedGame];let rows=[];(d.pokemon_encounters||[]).forEach(p=>p.version_details.forEach(v=>{if(version&&!version.includes(v.version.name))return;v.encounter_details.forEach(e=>rows.push({name:p.pokemon.name,chance:e.chance,method:e.method.name,min:e.min_level,max:e.max_level}))}));if(!rows.length){el.innerHTML=`<h3>${esc(name.replace(/-/g,' '))}</h3><p class="notice">Não há encontros específicos para a versão selecionada nesta área na fonte consultada, ou o nome da versão não corresponde exatamente ao jogo.</p>`;return}el.innerHTML=`<h3>${esc(name.replace(/-/g,' '))} · Encontros</h3><p class="notice">A chance exibida é a taxa de encontro informada pela fonte para cada método; não representa necessariamente uma probabilidade única combinada. Resultados dependem da versão e do método.</p>`+rows.map(x=>`<div class="listitem"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.method.replace(/-/g,' '))} · Nv. ${x.min}–${x.max}</div></div><div style="text-align:right"><b>${x.chance}%</b>${statusButtons(x.name)}</div></div></div>`).join('')}catch(e){el.innerHTML='<p class="notice">Não foi possível carregar os encontros. Tente novamente com internet.</p>'}}
function drawDex(){let q=($('#q')?.value||'').toLowerCase();let items=allPokemon.filter(p=>p.name.includes(q)||String(p.id)===q).slice(0,60);let g=$('#dexgrid');if(!g)return;g.innerHTML=items.map(p=>`<div class="pokemon"><img loading="lazy" src="${sprite(p)}" alt=""><b>${esc(p.name[0].toUpperCase()+p.name.slice(1))}</b><div class="muted">Nº ${String(p.id).padStart(4,'0')}</div><div style="margin-top:6px">${statusButtons(p.name)}</div><button class="secondary" style="width:100%;margin-top:8px" onclick="addToTeam('${esc(p.name)}')">+ Equipe</button></div>`).join('')||'<div class="panel">Nenhum resultado. Tente outro nome ou conecte-se à internet.</div>'}
function drawSuggestions(){let q=$('#teamq').value.toLowerCase();let m=allPokemon.filter(p=>p.name.includes(q)).slice(0,8);$('#suggestions').innerHTML=m.map(p=>`<div class="listitem row"><span>${esc(p.name)} <small class="muted">#${p.id}</small></span><button class="secondary" onclick="addToTeam('${esc(p.name)}')">Adicionar</button></div>`).join('')}
function addToTeam(name){let ts=getTeams();if(!ts.length){ts.push({id:Date.now(),name:$('#teamname')?.value.trim()||'Minha equipe',game:selectedGame,members:[]})}let t=ts[ts.length-1];if(t.members.length>=6){alert('Cada equipe pode ter no máximo 6 Pokémon.');return}if(t.members.includes(name)){alert('Esse Pokémon já está na equipe.');return}t.members.push(name);saveTeams(ts);if(tab==='teams')drawTeams();else{openTab('teams')}}
function drawTeams(){let el=$('#teamslist');if(!el)return;let ts=getTeams();el.innerHTML=ts.map(t=>`<div class="listitem"><div class="row"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.game)} · ${t.members.length}/6</div></div><button class="secondary" onclick="deleteTeam(${t.id})">Excluir</button></div><div>${t.members.map(p=>`<span class="pill">${esc(p)}</span>`).join(' ')||'<span class="muted">Equipe vazia</span>'}</div><div class="row" style="margin-top:8px"><input id="add-${t.id}" placeholder="Adicionar nome"/><button class="secondary" onclick="addNamed(${t.id})">Adicionar</button></div></div>`).join('')||'<p class="muted">Ainda não há equipes salvas.</p>'}function deleteTeam(id){saveTeams(getTeams().filter(t=>t.id!==id));drawTeams()}function addNamed(id){let v=$('#add-'+id).value.trim().toLowerCase();if(!v)return;let ts=getTeams(),t=ts.find(t=>t.id===id);if(t.members.length>=6)return alert('Máximo de 6 Pokémon.');t.members.push(v);saveTeams(ts);drawTeams()}
const statNames=['HP','Ataque','Defesa','Ataque Esp.','Defesa Esp.','Velocidade'];let baseStats=[35,55,40,50,50,90];function makeCalc(){let el=$('#calcstats');el.innerHTML='<div class="stats">'+statNames.map((s,i)=>`<div class="stat"><label>${s} · Base <span id="base${i}">${baseStats[i]}</span></label><div class="row"><div><label>IV (0–31)</label><input id="iv${i}" type="number" min="0" max="31" value="31"></div><div><label>EV (0–252)</label><input id="ev${i}" type="number" min="0" max="252" value="0"></div></div></div>`).join('')+'</div><p id="evsum" class="muted">EV total: 0 / 510</p>';$('#loadbase').onclick=loadBase;$('#calculate').onclick=calculate;el.querySelectorAll('input').forEach(i=>i.oninput=updateEv)}async function loadBase(){let name=$('#calcname').value.toLowerCase().trim();if(!name)return;try{let r=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(name));if(!r.ok)throw 0;let d=await r.json();let keys=['hp','attack','defense','special-attack','special-defense','speed'];baseStats=keys.map(k=>d.stats.find(s=>s.stat.name===k).base_stat);baseStats.forEach((v,i)=>$('#base'+i).textContent=v);$('#calcname').value=d.name;calculate()}catch(e){alert('Não consegui carregar esse Pokémon. Confira o nome e a conexão.')}}function updateEv(){let sum=0;for(let i=0;i<6;i++)sum+=Math.max(0,Math.min(252,Number($('#ev'+i).value)||0));$('#evsum').textContent=`EV total: ${sum} / 510`}
function calculate(){let lvl=Math.max(1,Math.min(100,Number($('#level').value)||50)),nature=$('#nature').value,up=null,down=null;const natureMap={Lonely:[1,2],Brave:[1,5],Adamant:[1,3],Naughty:[1,4],Bold:[2,1],Relaxed:[2,5],Impish:[2,3],Lax:[2,4],Timid:[5,1],Hasty:[5,2],Jolly:[5,3],Naive:[5,4],Modest:[3,1],Mild:[3,2],Quiet:[3,5],Rash:[3,4],Calm:[4,1],Gentle:[4,2],Sassy:[4,5],Careful:[4,3]};if(natureMap[nature]){up=natureMap[nature][0];down=natureMap[nature][1]}let out=[],sum=0;for(let i=0;i<6;i++){let iv=Math.max(0,Math.min(31,Number($('#iv'+i).value)||0)),ev=Math.max(0,Math.min(252,Number($('#ev'+i).value)||0)),b=baseStats[i];let val=i===0?Math.floor((2*b+iv+Math.floor(ev/4))*lvl/100)+lvl+10:Math.floor((Math.floor((2*b+iv+Math.floor(ev/4))*lvl/100)+5)*(i===up?1.1:i===down?0.9:1));out.push(val);sum+=Math.max(0,Math.min(252,Number($('#ev'+i).value)||0))}$('#calcresult').innerHTML=`<div class="result"><b>Atributos estimados · Nível ${lvl}</b><div class="stats" style="margin-top:8px">${out.map((v,i)=>`<div class="stat"><span class="muted">${statNames[i]}</span><div style="font-size:20px;font-weight:800">${v}</div></div>`).join('')}</div><p class="notice">EV total: ${sum}/510. Fórmula padrão de gerações III–IX; natureza neutra ou modificadora aplicada. Hacks que mudam regras precisam de configuração própria.</p></div>`;updateEv()}
loadDex();
